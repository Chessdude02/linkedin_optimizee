{% extends "base.html" %}
{% block title %}Dashboard — Control Center{% endblock %}
{% block content %}
<h1>Dashboard</h1>
<table class="counts">
  <tr><th>Status</th><th>Count</th></tr>
  {% for status, n in counts.items() %}
  <tr><td>{{ status }}</td><td>{{ n }}</td></tr>
  {% endfor %}
</table>
<p><a href="{{ url_for('pending.list_pending') }}">Review pending actions →</a></p>
{% endblock %}
