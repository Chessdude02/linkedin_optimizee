{% extends "base.html" %}
{% block title %}Sign in — Control Center{% endblock %}
{% block content %}
<h1>Control Center — Sign in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username<br><input type="text" name="username" autocomplete="username" required autofocus></label><br>
  <label>Password<br><input type="password" name="password" autocomplete="current-password" required></label><br>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
